<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plague War Room</title>
<style>
  :root{
    --bg:#0f1826; --panel:#16223a; --panel2:#1c2b47; --line:#2b3d5f;
    --ink:#eaf1fb; --muted:#9fb2ce; --gold:#ffcf3f; --goldsoft:#3a3210;
    --build:#d3792a; --train:#3aa06a; --research:#3d8bd6; --raven:#9a6ff0; --heroes:#e0577f; --combat:#e0503f;
    --farm:#e8c15a; --lumber:#c98a4b; --herb:#5fbf7d; --star:#ffcf3f;
    --ok:#3aa06a; --warn:#e0a03f; --crit:#e0503f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0d1420,#0f1826 40%);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px;}
  .topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 14px;}
  .credit{font-size:13px;color:var(--muted);letter-spacing:.3px;}
  .credit b{color:var(--gold);}
  .credit.bottom{margin:28px 0 0;text-align:center;border-top:1px solid var(--line);padding-top:18px;font-size:13px;}
  .langsel{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);}
  .langsel select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:14px;}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:.2px;}
  h1 .sub{color:var(--gold);}
  .lead{color:var(--muted);max-width:840px;margin:0 0 22px;font-size:15px;}
  .principle{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);
    border-radius:12px;padding:14px 18px;margin:0 0 22px;font-size:14.5px;}
  .principle b{color:var(--gold);}

  /* ---------- TAB NAVIGATION ---------- */
  .nav{position:sticky;top:0;z-index:40;background:rgba(13,20,32,.93);backdrop-filter:blur(9px);
    border-bottom:1px solid var(--line);margin:0 -20px 20px;padding:0 20px;}
  .navin{max-width:1140px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tabbtn{flex:0 0 auto;background:none;border:0;border-bottom:2.5px solid transparent;color:var(--muted);
    font:inherit;font-size:14px;font-weight:600;padding:13px 15px 11px;cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;gap:7px;transition:color .13s,border-color .13s;}
  .tabbtn:hover{color:var(--ink);}
  .tabbtn[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold);}
  .tabbtn:focus-visible{outline:2px solid var(--gold);outline-offset:-3px;border-radius:6px;}
  .view{display:none;}
  .view.on{display:block;}

  .brand{display:flex;align-items:baseline;gap:11px;}
  .brand .mark{font-size:22px;font-weight:800;letter-spacing:3px;color:var(--gold);}
  .brand .srv{font-size:12px;color:var(--muted);letter-spacing:.6px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px;margin:0 0 22px;}
  .card h2{font-size:17px;margin:0 0 4px;}
  .card .hint{color:var(--muted);font-size:13px;margin:0 0 14px;}

  .controls{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;margin:0 0 16px;font-size:13.5px;color:var(--muted);}
  .controls label{display:flex;gap:7px;align-items:center;cursor:pointer;}
  .controls select,.controls input{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;}
  .clocks{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 6px;}
  .liveclock{font-size:13.5px;color:var(--muted);}
  .liveclock b{color:#7dffd8;font-variant-numeric:tabular-nums;font-size:15px;letter-spacing:.5px;}
  .liveclock b.you{color:var(--gold);}
  .tzhint{font-size:12px;color:var(--muted);margin:-4px 0 14px;max-width:820px;}
  .tzhint b{color:var(--ink);}
  .nowbanner{margin:2px 0 14px;padding:11px 14px;border-radius:10px;font-size:13.5px;background:#0e2a24;border:1px solid #1f6b57;color:#d7fff2;}
  .nowbanner b{color:#7dffd8;}
  .nowbanner.golden{background:#2c2610;border-color:#6a5a17;color:#fff3d0;}
  .nowbanner.golden b{color:var(--gold);}
  .nowbanner .lt{color:#9fb2ce;}
  tbody th .loc{display:block;font-size:11px;color:#7f93b2;font-weight:500;}
  td.now{outline:3px solid #34e0c0 !important;outline-offset:-1px;z-index:3;}
  td.now .now-tag{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#34e0c0;color:#062b24;font-size:9px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.5);}
  tr.nowrow th{color:#7dffd8;}

  .best{background:linear-gradient(180deg,#1d1a0e,#161d31);border:1px solid #5a4d18;border-radius:14px;padding:16px 18px;margin:0 0 24px;}
  .best h2{font-size:15px;margin:0 0 12px;color:var(--gold);letter-spacing:.3px;text-transform:uppercase;}
  .bestgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
  .bchip{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;position:relative;overflow:hidden;}
  .bchip .day{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .bchip .th{font-weight:700;font-size:14.5px;margin:2px 0 5px;}
  .bchip .tm{font-size:19px;font-weight:800;color:var(--gold);letter-spacing:.4px;}
  .bchip .act{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .bchip .bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .bchip.combat .tm{color:#ff9b8a;font-size:15px;}
  .bchip .gcal{display:inline-block;margin-top:9px;background:#2f6ff0;color:#fff;text-decoration:none;font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:8px;box-shadow:0 2px 8px rgba(47,111,240,.35);}
  .bchip .gcal:hover{filter:brightness(1.08);}
  .alarmbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:14px 0 0;padding-top:14px;border-top:1px solid #3a3210;font-size:13px;color:var(--muted);}
  .icsbtn{background:var(--gold);color:#3a2c00;border:0;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(255,207,63,.3);}
  .icsbtn:hover{filter:brightness(1.06);}
  .alarmbar label{display:flex;gap:6px;align-items:center;}
  .alarmbar select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:13px;}
  .alarmhint{flex:1 1 260px;min-width:220px;font-size:11.5px;color:#9fb2ce;}

  .gridscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  #grid{border-collapse:separate;border-spacing:5px;width:100%;min-width:720px;}
  #grid th,#grid td{text-align:center;}
  #grid thead th{font-size:13px;color:var(--muted);font-weight:600;padding:4px 2px;}
  #grid thead th.dhead{color:var(--ink);}
  #grid thead th .ad{display:block;font-size:11px;font-weight:600;margin-top:2px;}
  #grid tbody th{color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;padding-right:4px;text-align:right;}
  td.cell{border-radius:10px;padding:8px 4px;min-width:90px;height:58px;vertical-align:middle;border:1px solid rgba(255,255,255,.06);position:relative;transition:transform .1s;}
  td.cell .ic{font-size:16px;line-height:1;display:block;margin-bottom:3px;}
  td.cell .lb{font-size:11.5px;font-weight:600;color:#fff;display:block;}
  .build{background:var(--build);}  .train{background:var(--train);}
  .research{background:var(--research);} .raven{background:var(--raven);} .heroes{background:var(--heroes);}

  td.gold{outline:3px solid var(--gold);outline-offset:-1px;transform:scale(1.04);z-index:2;box-shadow:0 0 0 3px rgba(255,207,63,.30), 0 8px 22px rgba(255,207,63,.40);animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(255,207,63,.30),0 8px 22px rgba(255,207,63,.35);}50%{box-shadow:0 0 0 5px rgba(255,207,63,.45),0 10px 28px rgba(255,207,63,.55);}}
  td.gold .best-tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--gold);color:#3a2c00;font-size:9px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.5);}
  td.gold .lb{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);}
  body.onlygold td.cell:not(.gold){opacity:.16;filter:saturate(.4);transform:none;}
  body.onlygold td.gold{animation:none;}

  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:16px 0 2px;font-size:12.5px;color:var(--muted);}
  .legend .k{display:flex;gap:6px;align-items:center;}
  .legend .sw{width:14px;height:14px;border-radius:4px;display:inline-block;}
  .legend .star{color:var(--gold);font-size:14px;}

  .days{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
  .day{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .day.hasbest{border-color:#5a4d18;}
  .day .top{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .day .top .num{font-size:12px;color:var(--muted);}
  .day .top .theme{font-weight:700;font-size:15px;}
  .day .top .chip{margin-left:auto;font-size:11px;padding:3px 9px;border-radius:999px;color:#fff;font-weight:600;}
  .day .body{padding:13px 15px 16px;}
  .goldwin{background:linear-gradient(180deg,#332b0e,#241f0b);border:1.5px solid var(--gold);border-radius:10px;padding:11px 13px;margin:0 0 12px;font-size:13px;box-shadow:0 4px 14px rgba(255,207,63,.15);}
  .goldwin .hd{display:flex;align-items:center;gap:7px;color:var(--gold);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
  .goldwin .bigtime{font-size:22px;font-weight:800;color:var(--gold);letter-spacing:.5px;}
  .goldwin .forwhat{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .goldwin.combat{background:linear-gradient(180deg,#3a1f1a,#241413);border-color:var(--combat);box-shadow:none;}
  .goldwin.combat .hd,.goldwin.combat .bigtime{color:#ff9b8a;}
  .acts{margin:0;padding:0;list-style:none;font-size:13px;}
  .acts li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed #24344f;}
  .acts li:last-child{border-bottom:0;}
  .acts .pt{color:#8fe3ab;font-weight:600;white-space:nowrap;}
  .acts .pt.small{color:var(--muted);font-weight:500;}
  .tip{margin-top:12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;}
  .tip b{color:var(--ink);}

  /* ---------- SHARED NEW-MODULE UI ---------- */
  .sechead{margin:0 0 18px;}
  .sechead h2{font-size:22px;margin:0 0 5px;letter-spacing:.2px;}
  .sechead p{color:var(--muted);font-size:14.5px;margin:0;max-width:820px;}
  .note{background:#1a1f14;border:1px solid #40501f;border-left:3px solid var(--warn);border-radius:10px;
    padding:11px 14px;margin:0 0 20px;font-size:13px;color:#e2ecc9;}
  .note b{color:var(--warn);}
  .note ul{margin:7px 0 0;padding-left:19px;}
  .note li{margin:3px 0;}

  .ctlrow{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin:0 0 18px;}
  .step{display:flex;align-items:center;gap:10px;margin:0 0 12px;}
  .step .stepno{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:var(--goldsoft);color:var(--gold);
    border:1px solid #5a4d18;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .step h3{font-size:12px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:700;}
  .fld .spacer{display:block;height:16px;}
  .hint.warn{color:#f0cf8a;}
  .fld{display:flex;flex-direction:column;gap:5px;}
  .fld label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
  .fld select,.fld input{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;
    padding:8px 11px;font-size:14.5px;font-family:inherit;font-variant-numeric:tabular-nums;min-width:96px;}
  .fld select:focus-visible,.fld input:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
  .fld .unit{font-size:12px;color:var(--muted);}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:11px;margin:0 0 20px;}
  .tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;position:relative;overflow:hidden;}
  .tile .bar{position:absolute;left:0;top:0;bottom:0;width:3px;}
  .tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;display:flex;align-items:center;gap:5px;}
  .tile .v{font-size:23px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:.3px;}
  .tile .s{font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;}
  .tile.hero{background:linear-gradient(180deg,#241f0b,#181f33);border-color:#5a4d18;}
  .tile.hero .v{color:var(--gold);font-size:23px;line-height:1.25;}

  .dtable{width:100%;border-collapse:collapse;font-size:13.5px;}
  .dtable th,.dtable td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top;}
  .dtable thead th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
    font-weight:700;border-bottom:1.5px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel);z-index:2;}
  .dtable td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .dtable tbody tr:hover{background:rgba(255,255,255,.028);}
  .dtable tbody tr.inrange{background:rgba(255,207,63,.075);}
  .dtable tbody tr.inrange td:first-child{box-shadow:inset 3px 0 0 var(--gold);}
  .dtable .lvl{font-weight:800;font-variant-numeric:tabular-nums;}
  .dtable .fa{color:var(--farm);} .dtable .lu{color:var(--lumber);}
  .dtable .he{color:var(--herb);} .dtable .st{color:var(--star);}
  .dtable .none{color:#5d7092;}
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-height:none;}

  .pill{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);
    border-radius:999px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0;white-space:nowrap;}
  .pill.done{border-color:#2c6b4a;background:#132a20;color:#8fe3ab;}
  .pill.todo{border-color:#6a4a1a;background:#2a2010;color:#f0cf8a;}

  .search{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;
    padding:9px 13px;font-size:14.5px;font-family:inherit;width:100%;max-width:340px;}
  .search:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer;transition:.12s;}
  .chip:hover{color:var(--ink);border-color:#3f567f;}
  .chip[aria-pressed="true"]{background:var(--goldsoft);border-color:var(--gold);color:var(--gold);font-weight:700;}
  .chip:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}

  .empty{color:var(--muted);font-size:13.5px;padding:22px 4px;text-align:center;}

  /* ---------- GUIDE SUB-TABS ---------- */
  .subnav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;padding:0 0 16px;border-bottom:1px solid var(--line);}
  .subtab{background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--ink);
    font:inherit;font-size:14px;font-weight:600;padding:12px 16px;cursor:pointer;text-align:left;
    display:flex;flex-direction:column;gap:2px;min-width:210px;transition:border-color .13s,background .13s;}
  .subtab .sd{font-size:12px;font-weight:500;color:var(--muted);}
  .subtab:hover{border-color:#4a628d;background:var(--panel2);}
  .subtab[aria-selected="true"]{border-color:var(--gold);background:linear-gradient(180deg,#241f0b,#181f33);}
  .subtab[aria-selected="true"] .sn{color:var(--gold);}
  .subtab:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* ---------- ELIXIR SCRAMBLE ---------- */
  .tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:13px;margin:0 0 22px;}
  .tier{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;}
  .tier .th{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line);}
  .tier .badge{font-size:12px;font-weight:800;letter-spacing:.6px;padding:3px 9px;border-radius:6px;color:#0d1420;}
  .tier .tname{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
  .tier ul{margin:0;padding:11px 14px 14px;list-style:none;font-size:13.5px;}
  .tier li{padding:6px 0;border-bottom:1px dashed #24344f;}
  .tier li:last-child{border-bottom:0;}
  .tier li b{display:block;font-size:14px;}
  .tier li span{color:var(--muted);font-size:12.5px;}

  .groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:13px;margin:0 0 22px;}
  .grp{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:0 0 14px;overflow:hidden;}
  .grp .gh{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:5px 9px;flex-wrap:wrap;min-height:52px;}
  .grp .gnum{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
  .grp .gname{font-size:15.5px;font-weight:800;}
  .grp .gcount{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;}
  .grp ul{margin:0;padding:12px 15px 0;list-style:none;font-size:13.5px;}
  .grp li{padding:4px 0 4px 16px;position:relative;color:var(--ink);}
  .grp li::before{content:"";position:absolute;left:2px;top:11px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55;}
  .roster{padding:11px 15px 0;}
  .roster label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;display:block;margin-bottom:5px;}
  .roster textarea{width:100%;min-height:74px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;resize:vertical;}
  .roster textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}

  .phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:13px;margin:0 0 22px;}
  .ph{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:0 0 13px 13px;padding:14px 15px 16px;}
  .ph .pt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
  .ph .pw{font-size:20px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;margin:2px 0 3px;}
  .ph .po{font-size:13.5px;font-weight:600;margin-bottom:8px;}
  .ph ul{margin:0;padding-left:17px;font-size:13px;color:var(--muted);}
  .ph li{margin:4px 0;}

  .twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px;margin:0 0 22px;}
  .rules{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px 16px;}
  .rules h3{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.5px;}
  .rules.win h3{color:#8fe3ab;} .rules.hard h3{color:#ff9b8a;}
  .rules ul{margin:0;padding:0;list-style:none;font-size:13.5px;}
  .rules li{padding:5px 0 5px 25px;position:relative;border-bottom:1px dashed #24344f;}
  .rules li:last-child{border-bottom:0;}
  .rules.win li::before{content:"\2713";position:absolute;left:2px;color:#8fe3ab;font-weight:800;}
  .rules.hard li::before{content:"\2715";position:absolute;left:2px;color:#ff9b8a;font-weight:800;}

  .callout{background:linear-gradient(180deg,#241f0b,#181f33);border:1.5px solid var(--gold);border-radius:13px;
    padding:15px 18px;margin:0 0 22px;}

function getActLabel(d,i){ return LANG==="en" ? AD[d].acts[i][0] : (DTR[LANG].acts[d][i] || AD[d].acts[i][0]); }
function actLbl(k){ return T().act[k]; }

/* ============ TIME HELPERS ============ */
const UTC = [-720,-660,-600,-570,-540,-480,-420,-360,-300,-240,-210,-180,-120,-60,0,60,120,180,210,240,270,300,330,345,360,390,420,480,510,540,570,600,630,660,720,765,780,840];
function utcLabel(m){ const s=m<0?"−":"+"; const a=Math.abs(m); return "UTC"+s+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0"); }
function fillUTC(sel, def){ let hasDef=UTC.includes(def);
  UTC.forEach(m=>{ const o=document.createElement("option"); o.value=m; o.textContent=utcLabel(m); if(m===(hasDef?def:0))o.selected=true; sel.appendChild(o); }); }
const SERVER_UTC = -120; // Server 249 = UTC−2
function serverOffset(){ return SERVER_UTC; }
function youOffset(){ return (+document.getElementById("youutc").value); }
function deviceOffset(){ return -(new Date().getTimezoneOffset()); }
function delta(){ return youOffset() - serverOffset(); }
function utcNowSec(){ const n=new Date(); return n.getUTCHours()*3600 + n.getUTCMinutes()*60 + n.getUTCSeconds(); }
function serverNowSec(){ return ((utcNowSec() + serverOffset()*60)%86400 + 86400)%86400; }
function youNowSec(){ return ((utcNowSec() + youOffset()*60)%86400 + 86400)%86400; }
function fmtMin(mins){ mins=((mins%1440)+1440)%1440; return String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0"); }
function fmtSec(sec){ sec=((sec%86400)+86400)%86400; return String(Math.floor(sec/3600)).padStart(2,"0")+":"+String(Math.floor(sec%3600/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0"); }
function windowStr(startHourServer, d){ const s=startHourServer*60; const srv=fmtMin(s)+"–"+fmtMin(s+240);
  if(d===0) return srv; return srv+' <span class="lt">('+T().you+' '+fmtMin(s+d)+"–"+fmtMin(s+d+240)+")</span>"; }
function nowWinIndex(){ const h=Math.floor(serverNowSec()/3600); for(let i=0;i<HOURS.length;i++){ const s=HOURS[i]; if(h>=s && h<s+4) return i; } return HOURS.indexOf(0); }

/* ============ ALIGNMENT ============ */
function serverWeekday(){ return new Date(Date.now()+serverOffset()*60000).getUTCDay(); }
function autoOn(){ return document.getElementById("autoday").checked; }
function applyAuto(){
  if(!autoOn()) return;
  const wd=serverWeekday();
  document.getElementById("adday").value = String(wd);
}
function adToday(){ return +document.getElementById("adday").value; }
function sbForAd(D){ return D+1; }
function goldIdxForAd(D){ return SB[sbForAd(D)].indexOf(AD[D].match); }
function wdName(dayIndex){ return T().wd[((dayIndex%7)+7)%7]; }

/* ============ RENDER ============ */
function buildGrid(d){
  const hrow=document.getElementById("hrow"), brows=document.getElementById("brows");
  hrow.innerHTML='<th></th>';
  for(let D=1; D<=AD_DAYS; D++){
    const th=document.createElement("th"); th.className="dhead";
    th.innerHTML=T().day+' '+D+' · '+wdName(D)
      +'<span class="ad" style="color:'+AD[D].chip+'">'+getTheme(D)+(AD[D].inferred?' *':'')+'</span>';
    hrow.appendChild(th);
  }
  brows.innerHTML="";
  const nowIdx=nowWinIndex(); const nowAd=adToday();
  for(let hi=0; hi<HOURS.length; hi++){
    const tr=document.createElement("tr"); if(hi===nowIdx) tr.className="nowrow";
    const rl=document.createElement("th");
    rl.innerHTML = fmtMin(HOURS[hi]*60) + (d!==0? '<span class="loc">'+T().you+' '+fmtMin(HOURS[hi]*60+d)+'</span>' : '');
    tr.appendChild(rl);
    for(let D=1; D<=AD_DAYS; D++){
      const act=SB[sbForAd(D)][hi]; const a=ACT[act]; const td=document.createElement("td");
      td.className="cell "+a.cls; let tag="";
      if(AD[D].match===act){ td.classList.add("gold"); tag='<span class="best-tag">★ BEST</span>'; }
      if(hi===nowIdx && D===nowAd){ td.classList.add("now"); tag+='<span class="now-tag">◉ NOW</span>'; }
      td.innerHTML=tag+'<span class="ic">'+a.ic+'</span><span class="lb">'+actLbl(act)+'</span>';
      tr.appendChild(td);
    }
    brows.appendChild(tr);
  }
}
function buildBest(d){
  const wrap=document.getElementById("bestgrid"); wrap.innerHTML="";
  for(let day=1; day<=AD_DAYS; day++){
    const ad=AD[day]; const el=document.createElement("div");
    const gcal='<a class="gcal" href="'+gcalUrl(day)+'" target="_blank" rel="noopener">'+T().gcalBtn+'</a>';
    if(ad.combat){
      el.className="bchip combat";
      el.innerHTML='<span class="bar" style="background:var(--combat)"></span><div class="day">'+T().day+' '+day+' · '+wdName(day)+'</div><div class="th">'+getTheme(day)+'</div><div class="tm">'+T().allDay+' ⚔️</div><div class="act">'+T().coordAttacks+'</div>'+gcal;
    }else{
      const start=goldIdxForAd(day);
      el.className="bchip";
      el.innerHTML='<span class="bar" style="background:'+ad.chip+'"></span><div class="day">'+T().day+' '+day+' · '+wdName(day)+(ad.inferred?' *':'')+'</div><div class="th">'+getTheme(day)+'</div><div class="tm">'+windowStr(HOURS[start],d)+'</div><div class="act">'+T().battleActivity+' '+actLbl(ad.match)+' · SB '+T().day+' '+sbForAd(day)+'</div>'+gcal;
    }
    wrap.appendChild(el);
  }
}
function buildDays(d){
  const wrap=document.getElementById("days"); wrap.innerHTML="";
  for(let day=1; day<=AD_DAYS; day++){
    const ad=AD[day]; const el=document.createElement("div"); el.className="day"+(ad.combat?"":" hasbest");
    const actsHtml=ad.acts.map((a,i)=>'<li><span>'+getActLabel(day,i)+'</span><span class="pt'+(a[2]?' small':'')+'">'+a[1]+'</span></li>').join("");
    let gold;
    if(ad.combat){
      gold='<div class="goldwin combat"><div class="hd">'+T().battleDayNoStar+'</div><div class="bigtime">'+T().allDay+'</div><div class="forwhat">'+T().combatForwhat+'</div></div>';
    }else{
      const start=goldIdxForAd(day);
      gold='<div class="goldwin"><div class="hd">'+T().bestWindow+'</div><div class="bigtime">'+windowStr(HOURS[start],d)+'</div><div class="forwhat">'+T().sbActivity+' <b>'+actLbl(ad.match)+'</b> · SB '+T().day+' '+sbForAd(day)+'</div></div>';
    }
    el.innerHTML='<div class="top"><div><div class="num">'+T().day+' '+day+' · '+wdName(day)+'</div><div class="theme">'+getTheme(day)+'</div></div><span class="chip" style="background:'+ad.chip+';border:0;cursor:default">Alliance Duel'+(ad.inferred?' *':'')+'</span></div><div class="body">'+gold+'<ul class="acts">'+actsHtml+'</ul><div class="tip">💡 '+getTip(day)+'</div></div>';
    wrap.appendChild(el);
  }
}
function updateNowBanner(d){
  const el=document.getElementById("nowbanner");
  const idx=nowWinIndex(); const adT=adToday();
  const srv=fmtMin(Math.floor(serverNowSec()/60));
  const ad = (adT>=1 && adT<=AD_DAYS) ? AD[adT] : null;
  const sbDay = ad ? sbForAd(adT) : 1;
  const act=SB[sbDay][idx];
  const winSrv=fmtMin(HOURS[idx]*60)+"–"+fmtMin(HOURS[idx]*60+240);
  const isGold = ad && !ad.combat && ad.match===act;
  const localTxt = d!==0 ? ' <span class="lt">('+T().yourTimeColon+' '+fmtMin(HOURS[idx]*60+d)+"–"+fmtMin(HOURS[idx]*60+240+d)+")</span>" : "";
  const dayLbl = ad ? ('AD '+T().day+' '+adT+' · '+wdName(adT)+' ('+getTheme(adT)+')')
                    : (T().battleOnly+' · '+wdName(0)+' (SB '+T().day+' 1)');
  const head='◉ <b>'+T().nowServer+' '+srv+'</b> · '+dayLbl+'. '+T().windowW+' <b>'+winSrv+'</b>'+localTxt+' → '+T().activityW+' <b>'+actLbl(act)+'</b>.';
  let msg;
  if(isGold){ el.className="nowbanner golden"; msg=head+' ★ <b>'+T().doubleNow+'</b>'; }
  else{
    el.className="nowbanner"; let nxt="";
    if(ad && ad.combat){ nxt=' '+T().battleCoordAll; }
    else if(ad && ad.match){ const gi=SB[sbDay].indexOf(ad.match); nxt=' '+T().nextStar+' <b>'+fmtMin(HOURS[gi]*60)+"–"+fmtMin(HOURS[gi]*60+240)+'</b> ('+actLbl(ad.match)+').'; }
    msg=head+nxt;
  }
  el.innerHTML=msg;
}

  document.getElementById("liveclock").textContent = fmtSec(serverNowSec());

}
/* ============ CALENDAR ALARMS (.ics) ============ */
function buildICS(mins){
  const pad=n=>String(n).padStart(2,"0");
  const fmt=dt=>dt.getUTCFullYear()+pad(dt.getUTCMonth()+1)+pad(dt.getUTCDate())+"T"+pad(dt.getUTCHours())+pad(dt.getUTCMinutes())+"00Z";
  const now=new Date(); const stamp=fmt(now);
  const BYDAY=["SU","MO","TU","WE","TH","FR","SA"];
  function evDate(wd, utcHour){
    const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),utcHour,0,0));
    d.setUTCDate(d.getUTCDate() + (((wd-d.getUTCDay())%7+7)%7));
    return d;
  }
  const srvToUtc = h => ((h - serverOffset()/60)%24+24)%24;
  const out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//EOS Alliance Server 249//AD Planner//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  for(let D=1; D<=AD_DAYS; D++){
    const wd=D;
    let shServer, dur, summ;
    if(AD[D].combat){ shServer=12; dur="PT8H"; summ="⚔️ "+getTheme(D)+" — "+T().coordAttacks; }
    else { shServer=HOURS[goldIdxForAd(D)]; dur="PT4H"; summ="★ "+getTheme(D)+" — "+T().legendDouble; }
    const start=evDate(wd, srvToUtc(shServer));
    out.push("BEGIN:VEVENT",
      "UID:ad-eos249-day"+D+"@planner",
      "DTSTAMP:"+stamp,
      "DTSTART:"+fmt(start),
      "DURATION:"+dur,
      "RRULE:FREQ=WEEKLY;BYDAY="+BYDAY[wd],
      "SUMMARY:"+summ,
      "DESCRIPTION:Alliance Duel "+T().day+" "+D+" ("+wdName(D)+") — Survival Battle × Alliance Duel — EOS Server 249",
      "BEGIN:VALARM","TRIGGER:-PT"+mins+"M","ACTION:DISPLAY","DESCRIPTION:"+summ,"END:VALARM",
      "END:VEVENT");
  }
  out.push("END:VCALENDAR");
  return out.join("\r\n");
}
function downloadICS(){
  const mins=+document.getElementById("remind").value;
  const blob=new Blob([buildICS(mins)],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="eos-alliance-duel-alarms.ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
function gcalUrl(D){
  const pad=n=>String(n).padStart(2,"0");
  const fmt=dt=>dt.getUTCFullYear()+pad(dt.getUTCMonth()+1)+pad(dt.getUTCDate())+"T"+pad(dt.getUTCHours())+pad(dt.getUTCMinutes())+"00Z";
  const BYDAY=["SU","MO","TU","WE","TH","FR","SA"];
  const now=new Date();
  const combat=AD[D].combat;
  const shServer=combat?12:HOURS[goldIdxForAd(D)];
  const utcHour=((shServer - serverOffset()/60)%24+24)%24;
  const start=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),utcHour,0,0));
  start.setUTCDate(start.getUTCDate() + (((D-start.getUTCDay())%7+7)%7));
  const end=new Date(start.getTime()+(combat?8:4)*3600000);
  const text=(combat?"⚔️ ":"★ ")+getTheme(D)+" — Alliance Duel (EOS)";
  const details=(combat?T().coordAttacks:(T().sbActivity+" "+actLbl(AD[D].match)))+" · EOS Server 249 ("+wdName(D)+")";
  const p=new URLSearchParams({action:"TEMPLATE", text:text, dates:fmt(start)+"/"+fmt(end), details:details});
  return "https://calendar.google.com/calendar/render?"+p.toString()+"&recur="+encodeURIComponent("RRULE:FREQ=WEEKLY;BYDAY="+BYDAY[D]);
}

/* ---------- formatting ---------- */
function fmtN(n){
  if(!n) return "—";
  if(n>=1e9) return (n/1e9).toFixed(2).replace(/\.?0+$/,"")+"B";
  if(n>=1e6) return (n/1e6).toFixed(n>=1e8?0:1).replace(/\.0$/,"")+"M";
  if(n>=1e3) return (n/1e3).toFixed(n>=1e5?0:1).replace(/\.0$/,"")+"K";
  return String(n);
}
function fmtT(sec){
  sec=Math.round(sec);
  if(sec<=0) return "—";
  const e=E(), D=e.dayL||"d", H=e.hourL||"h", M=e.minL||"m", SS=e.secL||"s";
  const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60), s=sec%60;
  if(d) return d+D+" "+h+H+(m?" "+m+M:"");
  if(h) return h+H+" "+m+M;
  if(m) return m+M+(s?" "+s+SS:"");
  return s+SS;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function bName(k){ return E().bld[k] || k; }

/* ---------- sanctuary maths ---------- */
function sanctRange(a,b){
  let g=0,w=0,h=0,t=0,stars=0; const need={};
  for(let lv=a+1; lv<=b; lv++){
    const r=SANCT[lv]; if(!r) continue;
    g+=r.g; w+=r.w; h+=r.h; t+=r.t; stars=Math.max(stars,r.s);
    r.req.forEach(([k,l])=>{ need[k]=Math.max(need[k]||0, l); });
  }
  return {g,w,h,t,stars,need};
}
function bldRange(k,from,to){
  let g=0,w=0,h=0,t=0; const tbl=BLD[k]||{};
  for(let lv=from+1; lv<=to; lv++){ const r=tbl[lv]; if(!r) continue; g+=r.g; w+=r.w; h+=r.h; t+=r.t||0; }
  return {g,w,h,t};
}

  document.querySelectorAll(".mylv").forEach(inp=>{

      inp.value=v; MY[kk]=v; saveMy();
      if(CALC) doCalc();
    });
  });

function doCalc(){
  const e=E(), h=document.getElementById("sxHintGo");
  const B=curBld();
  const av=document.getElementById("sxA").value, bv=document.getElementById("sxB").value;
  if(av===""||bv===""){ CALC=null; document.getElementById("sxResult").hidden=true; h.className="hint warn"; h.textContent=e.sxErrPick; return; }
  const a=+av, b=+bv;
  if(b<=a){ CALC=null; document.getElementById("sxResult").hidden=true; h.className="hint warn"; h.textContent=e.sxErrOrder; return; }
  const cut=Math.min(95,Math.max(0,+document.getElementById("sxR").value||0));
  const cutR=Math.min(95,Math.max(0,+document.getElementById("sxRC").value||0));
  const k=1-cut/100, kr=1-cutR/100;

  if(B!=="sanct"){
    CALC={mode:"b", B:B, a:a, b:b, k:k, kr:kr, cutR:cutR, r:bldRange(B,a,b)};
  }else{
    const S=sanctRange(a,b); const rows=[]; let bg=0,bw=0,bh=0,bt=0;
    /* being at Sanctuary Lv.a already implies every prerequisite up to Lv.a is met */
    const base={};
    for(let lv=2; lv<=a; lv++) SANCT[lv].req.forEach(([kk,l])=>{ base[kk]=Math.max(base[kk]||0,l); });
    BKEYS.forEach(kk=>{
      const target=S.need[kk]||0; if(!target) return;
      const from=Math.min(Math.max(myLvl(kk), base[kk]||0), target); if(from>=target) return;
      const r=bldRange(kk,from,target);
      bg+=r.g; bw+=r.w; bh+=r.h; bt+=r.t;
      rows.push({k:kk,from:from,to:target,r:r});
    });
    CALC={mode:"s", a:a, b:b, k:k, kr:kr, cutR:cutR, S:S, rows:rows, bg:bg, bw:bw, bh:bh, bt:bt};
  }
  h.className="hint"; h.textContent=e.sxHintGo;
  renderResult(CALC);
  buildRefTable(B);
}

function buildRefTable(B){
  const e=E(), c=e.sxTblCols, max=sxMax(B);
  const a = (CALC && ((CALC.mode==="s"&&B==="sanct") || (CALC.mode==="b"&&CALC.B===B))) ? CALC.a : -1;
  const b = a>=0 ? CALC.b : -1;
  document.getElementById("sxTblTitle").textContent=e.sxTblFor+" "+sxName(B)+" — Lv.1→"+max;
  document.getElementById("sxTblHint").textContent=e.sxTblHint;

  let h='<thead><tr><th>'+c.lv+'</th><th class="num">'+c.g+'</th><th class="num">'+c.w+'</th><th class="num">'+c.h+'</th>';
  if(B==="sanct") h+='<th class="num">'+c.s+'</th>';
  h+='<th class="num">'+c.t+'</th>';
  if(B==="sanct") h+='<th>'+c.req+'</th>';
  h+='</tr></thead><tbody>';

  const lo = B==="sanct" ? 2 : 1;
  for(let lv=lo; lv<=max; lv++){
    const r = B==="sanct" ? SANCT[lv] : BLD[B][lv];
    if(!r) continue;
    const inR = a>=0 && lv>a && lv<=b;
    h+='<tr'+(inR?' class="inrange"':'')+'><td class="lvl">'+lv+'</td>'
      +'<td class="num fa">'+fmtN(r.g)+'</td><td class="num lu">'+fmtN(r.w)+'</td><td class="num he">'+fmtN(r.h)+'</td>';
    if(B==="sanct") h+='<td class="num st">'+(r.s||"—")+'</td>';
    h+='<td class="num">'+fmtT(r.t)+'</td>';
    if(B==="sanct"){
      const req=r.req.length ? r.req.map(([k,l])=>'<span class="pill">'+esc(bName(k))+' <b>'+l+'</b></span>').join("") : '<span class="none">—</span>';
      h+='<td>'+req+'</td>';
    }
    h+='</tr>';
  }
  document.getElementById("sxTable").innerHTML=h+'</tbody>';
}

    +'<span class="gname" style="color:'+g.col+'">'+g.name+'</span><span class="gcount">'+g.cnt+'</span></div>'
    +'<ul>'+g.li.map(x=>'<li>'+x+'</li>').join("")+'</ul>'
    +'<div class="roster"><label for="ros'+g.n+'">'+e.exRoster+'</label>'
    +'<textarea id="ros'+g.n+'" data-g="'+g.n+'" placeholder="'+e.exRosterPh+'">'+esc(saved["g"+g.n]||"")+'</textarea></div></div>').join("");
  document.querySelectorAll(".roster textarea").forEach(t=>t.addEventListener("input",()=>{
    const o={}; document.querySelectorAll(".roster textarea").forEach(x=>o["g"+x.dataset.g]=x.value);
    try{ localStorage.setItem("eos_roster", JSON.stringify(o)); }catch(x){}
  }));

  document.getElementById("exPhases").innerHTML=e.phases.map((p,i)=>
    '<div class="ph"><div class="pt">'+(LANG==="it"?"Fase":"Phase")+' '+(i+1)+'</div><div class="pw">'+p.w+'</div>'
    +'<div class="po">'+p.o+'</div><ul>'+p.li.map(x=>'<li>'+x+'</li>').join("")+'</ul></div>').join("");

  document.getElementById("exRules").innerHTML=
     '<div class="rules win"><h3>'+e.exWinH+'</h3><ul>'+e.win.map(x=>'<li>'+x+'</li>').join("")+'</ul></div>'
    +'<div class="rules hard"><h3>'+e.exHardH+'</h3><ul>'+e.hard.map(x=>'<li>'+x+'</li>').join("")+'</ul></div>';

  document.getElementById("exCall").innerHTML=
    '<div class="ch">'+e.exCallH+'</div><div class="cq">'+e.exCallQ+'</div><div class="cs">'+e.exCallS+'</div>';
}

function renderEOS(){
  const e=E();
  document.querySelectorAll(".tabbtn").forEach(b=>{ b.querySelector("span").textContent=e.tabs[b.dataset.v]; });
  renderSanctuary(); renderPrereq(); renderElixir(); renderGuide();
}
["sxA","sxB"].forEach(id=>document.getElementById(id).addEventListener("change", hideResult));
["sxR","sxRC"].forEach(id=>document.getElementById(id).addEventListener("input", hideResult));
document.getElementById("sxBld").addEventListener("change", ()=>{ hideResult(); renderSanctuary(); });
document.getElementById("sxGo").addEventListener("click", doCalc);
document.getElementById("pqSearch").addEventListener("input", ()=>{ PQF=""; renderPrereq(); });

refresh();
try{ const t=localStorage.getItem("eos_tab"); if(t && document.getElementById("v-"+t)) showView(t); }catch(e){}

let lastMin="";
function tick(){ updateClocks(); const key=fmtMin(Math.floor(serverNowSec()/60)); if(key!==lastMin){ lastMin=key; refresh(); } }
tick();
setInterval(tick, 1000);
